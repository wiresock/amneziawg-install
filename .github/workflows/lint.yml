name: Shell Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Bash syntax check
        run: |
          bash -n amneziawg-install.sh
          bash -n amneziawg-web.sh
          bash -n amneziawg-web/scripts/amneziawg-web-install.sh
          bash -n amneziawg-web/scripts/amneziawg-web-privileged
          bash -n amneziawg-web/scripts/amneziawg-web-uninstall.sh
          bash -n amneziawg-web/scripts/amneziawg-web-upgrade.sh
          bash -n amneziawg-proxy.sh
          bash -n scripts/amneziawg-cargo-build.sh
          bash -n scripts/boringtun-artifact.sh
          bash -n scripts/boringtun-release.sh
          bash -n amneziawg-proxy/scripts/amneziawg-proxy-common.sh
          bash -n amneziawg-proxy/scripts/amneziawg-proxy-install.sh
          bash -n amneziawg-proxy/scripts/amneziawg-proxy-uninstall.sh
          bash -n amneziawg-proxy/scripts/amneziawg-proxy-upgrade.sh
          bash -n tests/test-cargo-build-common.sh
          bash -n tests/test-awg3.sh
          bash -n tests/test-backend.sh
          bash -n tests/test-boringtun-artifact.sh
          bash -n tests/test-boringtun-release.sh
          bash -n tests/test-boringtun-foreground-launcher.sh
          bash -n tests/test-boringtun-runtime.sh
          bash -n tests/test-boringtun-runtime-live.sh
          bash -n tests/test-boringtun-host.sh
          bash -n tests/test-boringtun-imitation.sh
          bash -n tests/test-boringtun-lifecycle.sh
          bash -n tests/test-boringtun-install-mock.sh
          bash -n tests/test-boringtun-host-live.sh
          bash -n tests/test-boringtun-kernel-coexistence.sh
          bash -n tests/test-boringtun-host-root-safety.sh
          bash -n .github/scripts/boringtun-host-diagnostics.sh
          bash -n tests/mutate-boringtun-runtime.sh
          bash -n tests/mutate-boringtun-host.sh
          bash -n tests/mutate-boringtun-imitation.sh
          bash -n tests/mutate-boringtun-lifecycle.sh
          bash -n tests/helpers/mutation-engine.sh
          bash -n tests/test-mutation-engine.sh
          bash -n tests/helpers/boringtun-live-firewall.sh
          bash -n tests/helpers/boringtun-lifecycle-fixture.sh
          bash -n tests/test-boringtun-live-firewall.sh
          bash -n tests/equivalence/run-kernel-equivalence.sh
          bash -n tests/equivalence/kernel-scenarios.sh
          bash -n tests/equivalence/kernel-install-uninstall.sh
          bash -n tests/helpers/boringtun-foreground-launcher.sh
          bash -n tests/test-proxy-bootstrap.sh
          bash -n tests/test-ubuntu-ppa.sh
          bash -n tests/test-ubuntu-ppa-variants.sh
          bash -n tests/test-ubuntu-resolute-live.sh
          bash -n tests/test-install-mock.sh

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run ShellCheck
        run: |
          shellcheck --severity=warning amneziawg-install.sh
          shellcheck --severity=warning amneziawg-web.sh
          shellcheck --severity=warning amneziawg-web/scripts/amneziawg-web-install.sh
          shellcheck --severity=warning amneziawg-web/scripts/amneziawg-web-privileged
          shellcheck --severity=warning amneziawg-web/scripts/amneziawg-web-uninstall.sh
          shellcheck --severity=warning amneziawg-web/scripts/amneziawg-web-upgrade.sh
          shellcheck --severity=warning amneziawg-proxy.sh
          shellcheck --severity=warning scripts/amneziawg-cargo-build.sh
          shellcheck --severity=warning scripts/boringtun-artifact.sh
          shellcheck --severity=warning -x scripts/boringtun-release.sh
          shellcheck --severity=warning amneziawg-proxy/scripts/amneziawg-proxy-common.sh
          shellcheck --severity=warning amneziawg-proxy/scripts/amneziawg-proxy-install.sh
          shellcheck --severity=warning amneziawg-proxy/scripts/amneziawg-proxy-uninstall.sh
          shellcheck --severity=warning amneziawg-proxy/scripts/amneziawg-proxy-upgrade.sh
          shellcheck --severity=warning tests/test-cargo-build-common.sh
          shellcheck --severity=warning tests/test-awg3.sh
          shellcheck --severity=warning tests/test-backend.sh
          shellcheck --severity=warning tests/test-boringtun-artifact.sh
          shellcheck --severity=warning tests/test-boringtun-release.sh
          shellcheck --severity=warning tests/test-boringtun-foreground-launcher.sh
          shellcheck --severity=warning tests/test-boringtun-runtime.sh
          shellcheck --severity=warning tests/test-boringtun-runtime-live.sh
          shellcheck --severity=warning tests/test-boringtun-host.sh
          shellcheck --severity=warning tests/test-boringtun-imitation.sh
          shellcheck --severity=warning tests/test-boringtun-lifecycle.sh
          shellcheck --severity=warning tests/test-boringtun-install-mock.sh
          shellcheck --severity=warning tests/test-boringtun-host-live.sh
          shellcheck --severity=warning tests/test-boringtun-kernel-coexistence.sh
          shellcheck --severity=warning tests/test-boringtun-host-root-safety.sh
          shellcheck --severity=warning .github/scripts/boringtun-host-diagnostics.sh
          shellcheck --severity=warning tests/mutate-boringtun-runtime.sh
          shellcheck --severity=warning tests/mutate-boringtun-host.sh
          shellcheck --severity=warning tests/mutate-boringtun-imitation.sh
          shellcheck --severity=warning tests/mutate-boringtun-lifecycle.sh
          shellcheck --severity=warning tests/helpers/mutation-engine.sh
          shellcheck --severity=warning tests/test-mutation-engine.sh
          shellcheck --severity=warning tests/helpers/boringtun-live-firewall.sh
          shellcheck --severity=warning tests/helpers/boringtun-lifecycle-fixture.sh
          shellcheck --severity=warning tests/test-boringtun-live-firewall.sh
          shellcheck --severity=warning tests/equivalence/run-kernel-equivalence.sh
          shellcheck --severity=warning tests/equivalence/kernel-scenarios.sh
          shellcheck --severity=warning tests/equivalence/kernel-install-uninstall.sh
          shellcheck --severity=warning tests/helpers/boringtun-foreground-launcher.sh
          shellcheck --severity=warning tests/test-proxy-bootstrap.sh
          shellcheck --severity=warning tests/test-ubuntu-ppa.sh
          shellcheck --severity=warning tests/test-ubuntu-ppa-variants.sh
          shellcheck --severity=warning tests/test-ubuntu-resolute-live.sh

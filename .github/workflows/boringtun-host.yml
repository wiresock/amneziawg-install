name: BoringTun Host

# End-to-end tests of the experimental BoringTun host backend of
# amneziawg-install.sh: the installer itself installs amneziawg-tools and the
# immutable public BoringTun release on disposable runners, moves traffic
# through the tunnel, switches protocol modes, cycles the built-in protocol
# imitation (checking the server's datagrams and the probe replies on the wire),
# moves the binary through --upgrade-boringtun and --rollback-boringtun (a TEST
# FIXTURE older release against the real pinned one)
# and uninstalls. The x86_64 job installs with the last installer version
# without protocol imitation and manages the host with this one, the upgrade
# path; the aarch64 and Debian jobs install with this one. A separate job
# downloads the public release that the installer embeds anonymously, and one
# proves coexistence with an installed AmneziaWG kernel module. Every job uses
# the release named by the installer's AWG_BT_RELEASE_* constants, never
# packaging/boringtun/release.env, which may prepare a newer release before an
# installer adopts it. See docs/BORINGTUN_BACKEND_DESIGN.md.

on:
  push:
    branches: [main]
    paths:
      - amneziawg-install.sh
      - tests/test-boringtun-host-live.sh
      - tests/test-boringtun-sip-wire-live.sh
      - tests/test-boringtun-public-release.sh
      - tests/test-boringtun-kernel-coexistence.sh
      - tests/helpers/boringtun-contracts.sh
      - tests/helpers/boringtun-live-firewall.sh
      - tests/helpers/boringtun-imitation-wire.py
      - tests/helpers/boringtun-lifecycle-fixture.sh
      - .github/workflows/boringtun-host.yml
  pull_request:
    branches: [main]
    paths:
      - amneziawg-install.sh
      - tests/test-boringtun-host-live.sh
      - tests/test-boringtun-sip-wire-live.sh
      - tests/test-boringtun-public-release.sh
      - tests/test-boringtun-kernel-coexistence.sh
      - tests/helpers/boringtun-contracts.sh
      - tests/helpers/boringtun-live-firewall.sh
      - tests/helpers/boringtun-imitation-wire.py
      - tests/helpers/boringtun-lifecycle-fixture.sh
      - .github/workflows/boringtun-host.yml
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  public-release:
    name: Public release download
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # The exact URLs the installer uses, without credentials: a renamed
      # asset, a wrong tag, an unpublished release or other bytes fail here.
      # The source of truth is the installer's AWG_BT_RELEASE_* constants
      # alone, the published release this installer consumes; release.env may
      # already prepare a newer one that no installer has adopted yet.
      - name: Download the embedded release anonymously and verify it
        run: bash tests/test-boringtun-public-release.sh

  live:
    name: Fresh host install (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            upgrade: true
          - arch: aarch64
            runner: ubuntu-24.04-arm
            upgrade: false
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check the runner's architecture
        env:
          EXPECTED: ${{ matrix.arch }}
        run: |
          uname -m
          test "$(uname -m)" = "$EXPECTED"

      # The upgrade path starts from main at the last commit before protocol
      # imitation (the BoringTun host install as released), fetched by its
      # fixed SHA so that it never follows main.
      - name: Fetch the last installer without protocol imitation
        if: matrix.upgrade
        run: |
          git fetch --no-tags --depth=1 origin 9f5a1afb87f73fd44b83e8abc8a0388efceeb8d5
          git show FETCH_HEAD:amneziawg-install.sh >"$RUNNER_TEMP/previous-installer.sh"
          echo "AWG_LIVE_PREVIOUS_INSTALLER=$RUNNER_TEMP/previous-installer.sh" >>"$GITHUB_ENV"

      # The helper-compatibility step runs the binary lifecycle with the
      # helpers that the PR 6 base installer renders, fetched by its fixed SHA.
      - name: Fetch the installer before the binary lifecycle
        if: matrix.upgrade
        run: |
          git fetch --no-tags --depth=1 origin 78b780bc8df73b86fa1c2722e7af2bd4e11e2a6a
          git show FETCH_HEAD:amneziawg-install.sh >"$RUNNER_TEMP/base-installer.sh"
          echo "AWG_LIVE_BASE_INSTALLER=$RUNNER_TEMP/base-installer.sh" >>"$GITHUB_ENV"

      - name: Install, use and uninstall BoringTun through the installer (as root)
        run: sudo env AWG_DISPOSABLE_HOST_TEST=1 AWG_LIVE_PREVIOUS_INSTALLER="${AWG_LIVE_PREVIOUS_INSTALLER:-}" AWG_LIVE_BASE_INSTALLER="${AWG_LIVE_BASE_INSTALLER:-}" bash tests/test-boringtun-host-live.sh

      - name: Collect diagnostics
        if: failure()
        run: bash .github/scripts/boringtun-host-diagnostics.sh "$RUNNER_TEMP/diagnostics"

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: boringtun-host-diagnostics-${{ matrix.arch }}
          path: ${{ runner.temp }}/diagnostics
          retention-days: 7

  debian:
    name: Fresh host install (Debian 12, systemd container)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # A privileged Debian 12 container with systemd as PID 1 is the CI
      # mechanism for a real Debian userland; it is not a supported deployment.
      - name: Start a Debian 12 container with systemd
        run: |
          docker build -t awg-debian12-systemd - <<'EOF'
          FROM debian:12
          RUN apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                systemd systemd-sysv dbus ca-certificates curl gnupg iproute2 iputils-ping kmod python3 procps nftables \
              && rm -rf /var/lib/apt/lists/*
          CMD ["/sbin/init"]
          EOF
          docker run -d --name awg-debian --privileged --cgroupns=host \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw --tmpfs /run --tmpfs /run/lock \
            -v "$PWD:/workspace:ro" awg-debian12-systemd
          for _ in $(seq 1 30); do
            docker exec awg-debian systemctl is-system-running 2>/dev/null | grep -qE 'running|degraded' && break
            sleep 1
          done
          docker exec awg-debian systemctl is-system-running || true

      - name: Install, use and uninstall BoringTun through the installer
        run: docker exec -w /workspace -e AWG_DISPOSABLE_HOST_TEST=1 awg-debian bash tests/test-boringtun-host-live.sh

      - name: Collect diagnostics
        if: failure()
        run: |
          docker cp .github/scripts/boringtun-host-diagnostics.sh awg-debian:/tmp/diagnostics.sh
          docker exec awg-debian bash /tmp/diagnostics.sh /tmp/diagnostics
          docker cp awg-debian:/tmp/diagnostics "$RUNNER_TEMP/diagnostics"

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: boringtun-host-diagnostics-debian12
          path: ${{ runner.temp }}/diagnostics
          retention-days: 7

  coexistence:
    name: Kernel module coexistence (Ubuntu 26.04, DKMS)
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Block or refuse the installed kernel module (as root)
        run: sudo env AWG_DISPOSABLE_HOST_TEST=1 bash tests/test-boringtun-kernel-coexistence.sh

      - name: Collect diagnostics
        if: failure()
        run: bash .github/scripts/boringtun-host-diagnostics.sh "$RUNNER_TEMP/diagnostics"

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: boringtun-coexistence-diagnostics
          path: ${{ runner.temp }}/diagnostics
          retention-days: 7
